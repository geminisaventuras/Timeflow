<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeFlow - Planificador Semanal Inteligente</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">⏱️</span>
                <h1>TimeFlow</h1>
            </div>
            <div class="header-actions">
                <button id="btn-stats" class="icon-btn" title="Estadísticas">📊</button>
                <button id="btn-settings" class="icon-btn" title="Configuración">⚙️</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Week Navigation -->
            <div class="week-nav">
                <button id="prev-week" class="nav-btn">◀</button>
                <h2 id="current-week-label">Semana Actual</h2>
                <button id="next-week" class="nav-btn">▶</button>
            </div>

            <!-- Timeline Container -->
            <div class="timeline-wrapper">
                <div class="timeline-header">
                    <div class="time-col">Hora</div>
                    <div class="days-grid" id="days-header">
                        <!-- Days injected by JS -->
                    </div>
                </div>
                <div class="timeline-body" id="timeline-body">
                    <!-- Time slots injected by JS -->
                </div>
            </div>
        </main>

        <!-- Floating Action Button -->
        <button id="fab-add" class="fab">+</button>
        <button id="fab-focus" class="fab fab-secondary" style="display:none;">🎯</button>
    </div>

    <!-- Modal: Add/Edit Block -->
    <div id="modal-block" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Nuevo Bloque</h3>
            <form id="block-form">
                <input type="hidden" id="block-id">
                <input type="hidden" id="block-day">
                <input type="hidden" id="block-hour">
                
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="block-title" required placeholder="Ej: Estudiar Matemáticas">
                </div>
                
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="block-category">
                        <!-- Categories injected by JS -->
                    </select>
                </div>

                <div class="form-group">
                    <label>Duración (horas)</label>
                    <input type="number" id="block-duration" min="0.5" step="0.5" value="1" required>
                </div>

                <div class="form-actions">
                    <button type="button" id="btn-delete-block" class="btn-danger" style="display:none;">Eliminar</button>
                    <div class="spacer"></div>
                    <button type="button" id="btn-cancel-block" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Settings -->
    <div id="modal-settings" class="modal">
        <div class="modal-content modal-large">
            <h3>Configuración</h3>
            <div class="settings-tabs">
                <button class="tab-btn active" data-tab="tab-categories">Categorías</button>
                <button class="tab-btn" data-tab="tab-goals">Metas</button>
                <button class="tab-btn" data-tab="tab-sounds">Sonidos</button>
                <button class="tab-btn" data-tab="tab-backup">Backup</button>
            </div>

            <div id="tab-categories" class="tab-content active">
                <div id="categories-list"></div>
                <button id="btn-add-category" class="btn-small">+ Nueva Categoría</button>
            </div>

            <div id="tab-goals" class="tab-content">
                <p>Define tus horas objetivo semanales por categoría.</p>
                <div id="goals-list"></div>
            </div>

            <div id="tab-sounds" class="tab-content">
                <div class="form-group">
                    <label>Ambiente Sonoro</label>
                    <select id="sound-select">
                        <option value="none">Silencio</option>
                        <option value="rain">Lluvia 🌧️</option>
                        <option value="cafe">Cafetería ☕</option>
                        <option value="forest">Bosque 🌲</option>
                        <option value="waves">Olas 🌊</option>
                        <option value="white">Ruido Blanco ⚪</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Volumen</label>
                    <input type="range" id="sound-volume" min="0" max="100" value="50">
                </div>
                <button id="btn-test-sound" class="btn-secondary">Probar Sonido</button>
            </div>

            <div id="tab-backup" class="tab-content">
                <div class="backup-actions">
                    <button id="btn-export" class="btn-primary">📥 Exportar Datos (JSON)</button>
                    <label class="btn-secondary" style="display:inline-block; cursor:pointer;">
                        📤 Importar Datos
                        <input type="file" id="file-import" accept=".json" style="display:none;">
                    </label>
                </div>
                <button id="btn-reset-app" class="btn-danger" style="margin-top:20px; width:100%;">⚠️ Borrar Todo</button>
            </div>

            <div class="form-actions" style="margin-top:20px;">
                <button id="btn-close-settings" class="btn-secondary" style="width:100%;">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Modal: Statistics -->
    <div id="modal-stats" class="modal">
        <div class="modal-content modal-large">
            <h3>Estadísticas Semanales</h3>
            <div class="stats-nav">
                <button id="stats-prev" class="nav-btn">◀</button>
                <span id="stats-week-label">Semana Actual</span>
                <button id="stats-next" class="nav-btn">▶</button>
            </div>
            
            <div class="chart-container">
                <canvas id="stats-chart"></canvas>
            </div>
            
            <div id="stats-details" class="stats-details">
                <!-- Details injected by JS -->
            </div>

            <div class="form-actions" style="margin-top:20px;">
                <button id="btn-export-ics" class="btn-secondary">📅 Exportar a Calendar (.ics)</button>
                <button id="btn-close-stats" class="btn-secondary" style="margin-left:auto;">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Modal: Focus Mode -->
    <div id="modal-focus" class="modal focus-mode">
        <div class="focus-content">
            <h2 id="focus-task-name">Tarea Actual</h2>
            <div class="timer-display" id="focus-timer">25:00</div>
            <div class="breathing-circle"></div>
            <div class="focus-controls">
                <button id="btn-pause-focus" class="btn-primary">Pausar</button>
                <button id="btn-stop-focus" class="btn-danger">Salir</button>
            </div>
            <p class="focus-hint">Modo Enfoque Activado • Notificaciones Silenciadas</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
